services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-dev
  api-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_hsml:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2052:2052"
      - "8080:8080"
    environment:
      NODE_ENV: development
      PHYSICS_PORT: "8080"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  caddy_data:
  caddy_config: