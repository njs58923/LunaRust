services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-dev
  api-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_hsml:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2052:2052"
      - "8080:8080"
    environment:
      NODE_ENV: development
      PHYSICS_PORT: "8080"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Sala de exposición de assets 3D. El HSML se genera por request desde
  # server_expo/public/models, así que agregar un .glb no requiere reiniciar.
  expo-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_expo:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2053:2053"
    environment:
      NODE_ENV: development
      PORT: "2053"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # Backrooms procedurales e infinitas. La geometría sale de un hash de las
  # coordenadas de celda, así que no hay nada persistido: el mismo chunk se
  # regenera igual siempre.
  backrooms-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_backrooms:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2055:2055"
    environment:
      NODE_ENV: development
      PORT: "2055"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # Banco de pruebas de carga: escenas que cargan un eje a la vez (figuras,
  # includes, isolates animados, modelos, montaje) y una tabla de resultados
  # que arma el propio cliente. Ver server_stress/README.md.
  stress-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_stress:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2056:2056"
    environment:
      NODE_ENV: development
      PORT: "2056"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # Bestiario nocturno: la isla de la home de noche, con cinco criaturas en
  # pedestales. Demo de animación dentro del .glb y de malla dinámica
  # (el cielo estrellado). Ver server_noche/README.md.
  noche-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_noche:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2057:2057"
    environment:
      NODE_ENV: development
      PORT: "2057"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # El puente entre todos los servidores: un directorio con una puerta por sitio,
  # buscador y estado en vivo. Ver server_puente/README.md.
  puente-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_puente:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2050:2050"
    # Dentro del contenedor `localhost` es el puente mismo: a los demás se llega
    # por el host, donde cada servicio de este compose publica su puerto.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: "2050"
      DESTINO_HOST: host.docker.internal
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # Cuántos otros jugadores entran en una escena: avatares con esqueleto y una
  # pose que llega por WebSocket. El 8082 es la multitud, no la física.
  # Ver server_jugadores/README.md.
  jugadores-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_jugadores:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2051:2051"
      - "8082:8082"
    environment:
      NODE_ENV: development
      PORT: "2051"
      CROWD_PORT: "8082"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # Las apps de la interfaz: ventanas embebidas del shell. Ver server_ui/README.md.
  ui-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_ui:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2058:2058"
    environment:
      NODE_ENV: development
      PORT: "2058"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # La sala de los ecos: audio espacial sobre el entorno compartido de la arcada.
  # Ver server_eco/README.md.
  eco-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_eco:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2059:2059"
    environment:
      NODE_ENV: development
      PORT: "2059"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # La arcada: salas de física con el servicio de simulación en el 8081. La
  # simulación corre en el servidor y el documento sólo dibuja lo que llega.
  # Ver server_arcada/README.md.
  arcada-dev:
    image: oven/bun:1
    working_dir: /usr/src/app
    volumes:
      - ../server_arcada:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "2060:2060"
      - "8081:8081"
    environment:
      NODE_ENV: development
      PORT: "2060"
      PHYSICS_PORT: "8081"
    command: ["sh", "-c", "bun install && bun add -g nodemon && nodemon --legacy-watch --watch src --ext ts,js,json --exec 'bun src/index.ts'"]
  # Backrooms, Nivel !: «Run for Your Life!». En Go y sin dependencias: el nivel
  # por HTTP en el 2061 y la persecución por WebSocket en el 8083.
  # Ver server_corre/README.md.
  corre-dev:
    image: golang:1.22
    working_dir: /usr/src/app
    volumes:
      - ../server_corre:/usr/src/app
    ports:
      - "2061:2061"
      - "8083:8083"
    environment:
      PORT: "2061"
      WS_PORT: "8083"
    command: ["go", "run", "."]
volumes:
  caddy_data:
  caddy_config: