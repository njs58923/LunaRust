[package]
name = "js_runtime"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
deno_core = "0.249.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.3"
rusqlite = { version = "0.37", features = ["bundled"] }
specs = "0.20"
specs-derive = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
